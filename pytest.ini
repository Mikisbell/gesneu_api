[pytest]
# Habilitar soporte para pruebas asíncronas
asyncio_mode = auto

# Mostrar resultados de pruebas más detallados
verbose = 1

# Mostrar la duración de las pruebas
addopts = --durations=10

# Configurar dónde buscar los tests
testpaths = tests

# Configurar el formato de salida de las pruebas
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Configurar cobertura de código
python_files = test_*.py
python_functions = test_*

# Ignorar directorios
norecursedirs = .git .tox venv env build dist

# Configurar warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# Configurar el nivel de logging
log_level = INFO
