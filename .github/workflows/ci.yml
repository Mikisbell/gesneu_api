name: CI

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # NOTE: next lint tiene un bug en Next.js 16 con el parsing de argumentos
      # Descomentar cuando se resuelva o usar eslint directamente
      # - name: Lint
      #   run: npm run lint

  test:
    name: Tests (Integration & E2E)
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: gesneu_test
        ports:
          - 5432:5432
        # Health check para asegurar que PG esté listo antes de correr pasos
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Setup Database Schema
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/gesneu_test?schema=public"
          DIRECT_URL: "postgresql://postgres:password@localhost:5432/gesneu_test?schema=public"

      - name: Seed Database
        run: npx ts-node --compiler-options "{\"module\":\"CommonJS\"}" prisma/seed.ts
        continue-on-error: true
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/gesneu_test?schema=public"
          DIRECT_URL: "postgresql://postgres:password@localhost:5432/gesneu_test?schema=public"

      - name: Run Tests
        run: npm test
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/gesneu_test?schema=public"
          DIRECT_URL: "postgresql://postgres:password@localhost:5432/gesneu_test?schema=public"
          NEXTAUTH_SECRET: "super-secret-test-key-must-be-long-enough"
          NEXTAUTH_URL: "http://localhost:3000"
          CI: true
