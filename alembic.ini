# A generic Alembic configuration file.
# Refer to the Alembic documentation at http://alembic.zzzcomputing.com
# for complete details.

[alembic]
# Ruta a los scripts de migración
script_location = alembic
version_locations = %(here)s/versions

# Configuración de la base de datos (se sobrescribe con la configuración de la aplicación)
sqlalchemy.url = postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_SERVER}:${POSTGRES_PORT}/${POSTGRES_DB}

# Formato para los nombres de los archivos de migración
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prevenir la generación de migraciones vacías
revision_environment = false

# Esta línea le dice a Alembic que busque tu código fuente en la carpeta raíz.
# Asegúrate de que solo aparezca UNA VEZ.
prepend_sys_path = .

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
